[workspace]
members = [
  "contracts/protocol-config",
  "contracts/issuer-registry",
  "contracts/proof-registry",
  "packages/shared",
  "tests/event-fixtures",
  "tests/events",
  "tests/emergency",
  "tests/budgets",
  "tests/authorization",
  "tests/cross-contract",
  "tests/property",
  "tests/time",
  "tests/encoding",
  "tests/ttl",
  "tests/storage-keys",
  "tests/error-catalog",
  "tests/compatibility",
  "tests/ledger-snapshots",
  "tests/address-validation",
  "fuzz"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/veridatum-labs/earnproof-contracts"

[workspace.dependencies]
soroban-sdk = "27.0.0"
earnproof-shared = { path = "packages/shared" }
proptest = "1.4"

[profile.release]
overflow-checks = true
