name: CI

on:
  push:
    branches: [develop]

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links and code references
        run: python3 scripts/check-doc-links.py
      - name: Check generated API reference
        run: python3 scripts/generate-reference.py --check

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo test --doc --workspace
      - run: cargo build --workspace

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests against JSON Schema
        run: |
          npx ajv-cli@5 validate \
            -s schemas/deployment-manifest.schema.json \
            -d "scripts/*.json" \
            --spec=draft7 \
            --all-errors

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Pinned exact version (#66) — an unpinned `cargo install cargo-llvm-cov`
      # would let the tool's own output format or default flags drift under
      # CI without anyone choosing that.
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Generate workspace coverage report
        run: |
          cargo llvm-cov --workspace --summary-only 2>&1 | tee coverage-summary.txt
          cargo llvm-cov report --json --output-path coverage.json
        # See docs/testing.md for what's covered, what's excluded and why,
        # and the critical-path minimums this job checks below.
      - name: Enforce critical-path coverage minimums
        run: python3 scripts/check-coverage-gates.py coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-summary.txt
            coverage.json
          retention-days: 30

  resource-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Run resource budget regression tests
        run: cargo test -p resource-budget-tests --release

  fuzz:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --version 0.11.4
      - name: Run fuzz smoke tests (30s per target)
        run: |
          cargo fuzz run fuzz_proof_record_decode -- -max_total_time=30
          cargo fuzz run fuzz_issuer_record_decode -- -max_total_time=30
          cargo fuzz run fuzz_issuer_status_decode -- -max_total_time=30
          cargo fuzz run fuzz_proof_status_decode -- -max_total_time=30
          cargo fuzz run fuzz_address_validation -- -max_total_time=30
          cargo fuzz run fuzz_entry_point_register_proof -- -max_total_time=30

  # Bounded mutation testing for the security-critical authorization/validation
  # branches (see tests/mutation/ and docs/testing.md). This is a full mutant run
  # and is intentionally not part of the fast PR loop: it runs on a weekly
  # schedule and on demand, and enforces the reviewed mutation score.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run bounded mutation profile and enforce reviewed score
        run: pwsh -NonInteractive -File scripts/mutation-test.ps1
      - name: Prove the gate catches seeded mutations
        run: pwsh -NonInteractive -File scripts/mutation-test.ps1 -SelfTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out
          path: mutants.out
